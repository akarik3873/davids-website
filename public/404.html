<!DOCTYPE html>

    <meta charset="utf-8">
    <title>Praxis Enrichment Center</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect handler
      var pathSegments = window.location.pathname.split('/').slice(1);
      var redirect = '/' + pathSegments.join('/') + window.location.search + window.location.hash;
      sessionStorage.redirect = redirect;
      window.location.href = '/';
    </script>
  </head>
