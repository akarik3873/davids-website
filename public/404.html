<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Praxis Enrichment Center</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect handler
      var pathSegments = window.location.pathname.split('/').slice(1);
      var path = '/' + pathSegments.join('/');
      if (path !== '/') {
        window.location.replace('/?spa_redirect=' + encodeURIComponent(path) + window.location.search.replace('?', '&') + window.location.hash);
      } else {
        window.location.replace('/');
      }
    </script>
  </head>
  <body>
  </body>
</html>
